<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ger Camp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Global Reset & Base Styles */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #0f172a;
        background: #f8fafc;
        overflow-x: hidden;
      }

      /* Subtle body background gradient */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(180deg, #f0f4f8 0%, #f8fafc 40%, #ffffff 100%);
        z-index: -1;
        pointer-events: none;
      }

      /* Focus visible styles for accessibility */
      :focus-visible {
        outline: 2px solid rgba(37, 99, 235, 0.5);
        outline-offset: 2px;
      }

      /* Smooth transitions for interactive elements */
      a, button, input, select, textarea {
        transition: all 0.2s ease-in-out;
      }

      /* Remove default link styles */
      a {
        color: inherit;
        text-decoration: none;
      }

      /* Button reset */
      button {
        font-family: inherit;
        font-size: inherit;
        border: none;
        background: none;
        cursor: pointer;
      }

      /* Image reset */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* List reset */
      ul, ol {
        list-style: none;
      }

      /* Heading styles */
      h1, h2, h3, h4, h5, h6 {
        font-weight: 700;
        line-height: 1.2;
        color: #0f172a;
      }

      h1 { font-size: 2.5rem; }
      h2 { font-size: 2rem; }
      h3 { font-size: 1.5rem; }
      h4 { font-size: 1.25rem; }
      h5 { font-size: 1rem; }
      h6 { font-size: 0.875rem; }

      /* Paragraph */
      p {
        margin-bottom: 1rem;
        color: #475569;
      }

      /* Selection color */
      ::selection {
        background: rgba(37, 99, 235, 0.2);
        color: #0f172a;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.03);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(37, 99, 235, 0.3);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(37, 99, 235, 0.5);
      }

      /* Utility classes */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Animation keyframes */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      /* Loading animation */
      .loading {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Fade in animation */
      .fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }

      /* Slide up animation */
      .slide-up {
        animation: slideUp 0.4s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
